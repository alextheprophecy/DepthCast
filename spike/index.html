<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>depthcast — Phase 0 spike</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font:
          14px/1.5 system-ui,
          sans-serif;
        background: #0b0b10;
        color: #e7e7ef;
      }
      header {
        padding: 16px 20px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      p {
        margin: 0;
        color: #9aa;
      }
      #stage {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 12px 20px;
      }
      canvas,
      img {
        width: 100%;
        border-radius: 10px;
        background: #000;
        display: block;
      }
      .label {
        font-size: 12px;
        color: #9aa;
        margin: 0 0 6px;
      }
      #status {
        padding: 8px 20px;
        color: #7fd;
        min-height: 20px;
      }
      input[type='file'] {
        color: #9aa;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>depthcast — Phase 0 spike</h1>
      <p>
        image → Depth Anything V2 (WebGPU) → WebGL2 displacement → mouse parallax. Standalone, no
        build.
      </p>
      <p style="margin-top: 8px">
        <input type="file" id="file" accept="image/*" /> or it auto-loads a sample.
      </p>
    </header>
    <div id="status">booting…</div>
    <div id="stage">
      <div>
        <p class="label">render (move your mouse)</p>
        <canvas id="gl"></canvas>
      </div>
      <div>
        <p class="label">computed depth</p>
        <img id="depth" alt="depth map" />
      </div>
    </div>

    <script type="module">
      import {
        pipeline,
        RawImage,
        env,
      } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4'

      const statusEl = document.getElementById('status')
      const setStatus = (m) => (statusEl.textContent = m)
      const SAMPLE = 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=900&q=80'

      // --- WebGL2 displacement (mirrors packages/core/src/gl) ---
      const VS = `#version 300 es
      precision highp float;
      in vec2 aPos; in vec2 aUV;
      uniform sampler2D uDepth; uniform float uIntensity; uniform vec2 uParallax;
      out vec2 vUV;
      void main(){ float d = texture(uDepth, aUV).r; vUV = aUV;
        vec2 p = aPos + uParallax * (d - 0.5) * 0.6;
        gl_Position = vec4(p, (d-0.5)*uIntensity, 1.0); }`
      const FS = `#version 300 es
      precision highp float; in vec2 vUV; uniform sampler2D uTex; out vec4 o;
      void main(){ o = texture(uTex, vUV); }`

      function compile(gl, type, src) {
        const s = gl.createShader(type)
        gl.shaderSource(s, src)
        gl.compileShader(s)
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s))
        return s
      }
      function tex(gl, src) {
        const t = gl.createTexture()
        gl.bindTexture(gl.TEXTURE_2D, t)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true)
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src)
        return t
      }

      function setupGL(canvas, image, depthImageData, aspect) {
        const gl = canvas.getContext('webgl2', { premultipliedAlpha: false })
        const prog = gl.createProgram()
        gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VS))
        gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, FS))
        gl.linkProgram(prog)
        gl.useProgram(prog)

        const S = 160,
          verts = [],
          idx = []
        for (let j = 0; j <= S; j++)
          for (let i = 0; i <= S; i++) {
            const u = i / S,
              v = j / S
            verts.push(u * 2 - 1, v * 2 - 1, u, v)
          }
        for (let j = 0; j < S; j++)
          for (let i = 0; i < S; i++) {
            const a = j * (S + 1) + i,
              b = a + 1,
              c = a + S + 1,
              d = c + 1
            idx.push(a, c, b, b, c, d)
          }
        const vao = gl.createVertexArray()
        gl.bindVertexArray(vao)
        const vbo = gl.createBuffer()
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo)
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW)
        const aPos = gl.getAttribLocation(prog, 'aPos'),
          aUV = gl.getAttribLocation(prog, 'aUV')
        gl.enableVertexAttribArray(aPos)
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 16, 0)
        gl.enableVertexAttribArray(aUV)
        gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 16, 8)
        const ibo = gl.createBuffer()
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo)
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(idx), gl.STATIC_DRAW)

        const tImg = tex(gl, image),
          tDepth = tex(gl, depthImageData)
        gl.uniform1i(gl.getUniformLocation(prog, 'uTex'), 0)
        gl.uniform1i(gl.getUniformLocation(prog, 'uDepth'), 1)
        gl.activeTexture(gl.TEXTURE0)
        gl.bindTexture(gl.TEXTURE_2D, tImg)
        gl.activeTexture(gl.TEXTURE1)
        gl.bindTexture(gl.TEXTURE_2D, tDepth)
        const uInt = gl.getUniformLocation(prog, 'uIntensity')
        const uPar = gl.getUniformLocation(prog, 'uParallax')

        let px = 0,
          py = 0,
          cx = 0,
          cy = 0
        canvas.addEventListener('pointermove', (e) => {
          const r = canvas.getBoundingClientRect()
          px = ((e.clientX - r.left) / r.width) * 2 - 1
          py = -(((e.clientY - r.top) / r.height) * 2 - 1)
        })
        function draw() {
          cx += (px - cx) * 0.1
          cy += (py - cy) * 0.1
          gl.viewport(0, 0, canvas.width, canvas.height)
          gl.clearColor(0, 0, 0, 1)
          gl.clear(gl.COLOR_BUFFER_BIT)
          gl.uniform1f(uInt, 0.4)
          gl.uniform2f(uPar, cx * 0.15, cy * 0.15)
          gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_INT, 0)
          requestAnimationFrame(draw)
        }
        canvas.width = 900
        canvas.height = Math.round(900 / aspect)
        draw()
      }

      let depthPipe
      async function run(url) {
        setStatus('loading depth model (first run downloads ~50MB, then cached)…')
        depthPipe ??= await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', {
          device: (await navigator.gpu?.requestAdapter?.()) ? 'webgpu' : undefined,
        })
        setStatus('running inference…')
        const image = await RawImage.fromURL(url)
        const small = await image.resize(900, Math.round((900 * image.height) / image.width))
        const { depth } = await depthPipe(small)
        const depthRGBA = depth.rgba ? await depth.rgba() : depth
        const depthImg = await (depth.toCanvas ? depth.toCanvas() : null)
        if (depthImg) document.getElementById('depth').src = depthImg.toDataURL?.() ?? ''
        setStatus('done — move your mouse over the left canvas ✨')
        setupGL(
          document.getElementById('gl'),
          await small.toCanvas(),
          await depth.toCanvas(),
          small.width / small.height,
        )
      }

      document.getElementById('file').addEventListener('change', (e) => {
        const f = e.target.files?.[0]
        if (f) run(URL.createObjectURL(f))
      })
      run(SAMPLE).catch((err) => setStatus('error: ' + err.message))
    </script>
  </body>
</html>
